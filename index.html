  {

<style>

    --ui-hover: #edf4e7; --ui-accent: #557f35; --ui-focus: #88ad67;

    --ui-button-glass: rgb(59 72 62 / 65%); --ui-action: #c0dca9; --ui-action-bg: rgb(65 89 49 / 65%);
    --ui-track: #465146; --ui-solid: #232c25; --key-top: #39443b; --key-bottom: #29342d; --key-ink: #d6e1d1;

  #playground { z-index: 4; position: fixed; right: 16px; bottom: 16px; width: min(304px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);

  body.ui-hidden #panel-content { display: none; }

    box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }

  body.ui-hidden #panel-footer { margin: 0; padding: 0; border: 0; }
  body.ui-hidden #toggle-ui { width: 40px; height: 40px; min-height: 40px; padding: 0; border: 0; border-radius: 0;
    background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  body.ui-hidden #toggle-ui:hover { background: transparent; border-color: transparent; }
  #playground .control { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; margin-top: 9px;

  #playground .control.toggle kbd, #view-hint kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px;
    box-sizing: border-box; margin-left: 7px; padding: 0 5px; border: 1px solid rgb(69 89 56 / 20%); border-bottom: 2px solid rgb(69 89 56 / 30%);
    border-radius: 5px; color: var(--key-ink); background: linear-gradient(var(--key-top), var(--key-bottom)); box-shadow: 0 1px 2px rgb(37 47 31 / 10%);

  #view-hint kbd { flex: none; min-width: 24px; height: 24px; margin: 0; padding: 0 4px; font-size: 13px; }

  #playground .control.toggle input:checked { border-color: var(--ui-accent); background: var(--ui-accent); }
  #playground .control.toggle input:checked::before { transform: translateX(15px); }
  #playground .control.toggle input:focus-visible { outline: 2px solid var(--ui-focus); outline-offset: 2px; }
  #playground .value-actions { display: flex; align-items: center; justify-content: flex-end; }
  #playground .reset-one { box-sizing: border-box; flex: 0 0 25px; width: 25px; min-width: 0; min-height: 25px; height: 25px; margin-left: 5px;
    padding: 0; overflow: hidden; color: var(--ui-muted); border-color: transparent; background: transparent;
    transition: flex-basis .18s ease, margin-left .18s ease, opacity .14s, color .14s, background-color .14s; }
  #playground .reset-one:disabled { flex-basis: 0; margin-left: 0; border-width: 0; opacity: 0; pointer-events: none; }
  #playground #reset-controls:disabled { opacity: .35; cursor: default; }
  #playground .lucide { display: block; width: 18px; height: 18px; stroke-width: 1.8; }
  #playground #toggle-ui .lucide { width: 20px; height: 20px; }
  #playground output { display: grid; overflow: hidden; height: 1.2em; align-items: center; color: var(--ui-ink); font-variant-numeric: tabular-nums; }
  #playground output > .value-line { grid-area: 1 / 1; display: flex; white-space: nowrap; }
  #playground .value-char { display: inline-grid; overflow: hidden; height: 1.2em; line-height: 1.2; }
  #playground .value-char > span { grid-area: 1 / 1; }
  #playground input:not([type="checkbox"]) { grid-column: 1 / -1; appearance: none; width: 100%; height: 20px; margin: 0; padding: 0;
    background: transparent; cursor: pointer; touch-action: pan-x; }
  #playground input::-webkit-slider-runnable-track { height: 5px; background: var(--ui-track); border-radius: 99px; }
  #playground input::-moz-range-track { height: 5px; background: var(--ui-track); border-radius: 99px; }
  #playground input::-webkit-slider-thumb { appearance: none; width: 17px; height: 17px; margin-top: -6px; border: 2px solid #fff;
    border-radius: 50%; background: var(--ui-accent); box-shadow: 0 0 0 1px var(--ui-accent); }
  #playground input::-moz-range-thumb { width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%;

  #playground input:hover::-webkit-slider-thumb, #playground input:hover::-moz-range-thumb { background: var(--ui-action); }
  #panel-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid rgb(83 108 63 / 12%); }
  #panel-footer .footer-actions { display: flex; align-items: center; gap: 8px; }
  #pick { display: none; }
  #playground::-webkit-scrollbar { width: 8px; }
  #playground::-webkit-scrollbar-thumb { background: rgb(83 108 63 / 25%); border: 2px solid transparent; border-radius: 8px; background-clip: padding-box; }
  #folder-menu { z-index: 6; position: fixed; display: grid; gap: 2px; width: 176px; box-sizing: border-box; padding: 6px;

    box-shadow: var(--ui-shadow); backdrop-filter: blur(22px) saturate(1.55); -webkit-backdrop-filter: blur(22px) saturate(1.55);
    font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #folder-menu[hidden] { display: none; }
  #folder-menu button { display: flex; align-items: center; width: 100%; min-height: 32px; padding: 0 9px; color: var(--ui-ink);
    background: transparent; border: 0; border-radius: 7px; font: inherit; text-align: left; cursor: pointer; }
  #folder-menu button:hover, #folder-menu button:focus-visible { color: var(--ui-action); background: var(--ui-hover); outline: 0; }
  #folder-menu button:focus-visible { box-shadow: inset 0 0 0 2px var(--ui-focus); }
  @media (prefers-reduced-transparency: reduce) { #playground, #folder-menu, #theme-toggle { background: var(--ui-solid); backdrop-filter: none; -webkit-backdrop-filter: none; } }
  @media (prefers-reduced-motion: reduce) {
    #playground button, #playground input[type="checkbox"], #playground input[type="checkbox"]::before, #playground .reset-one, #theme-toggle input::before { transition: none; }
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    #playground, #folder-menu, #theme-toggle { background: var(--ui-solid); }

  @media (max-width: 760px) {
    #view-tools { left: 8px; bottom: 8px; width: min(448px, calc(100vw - 16px)); }
    body.view-3d:not(.ui-hidden) #playground { bottom: calc(16px + 160px * var(--gizmo-origin, 1));
      max-height: calc(100dvh - 32px - 160px * var(--gizmo-origin, 1)); }
  }
  @media (max-width: 520px) {

    #playground { right: 8px; bottom: 8px; width: min(304px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); }
    body.view-3d:not(.ui-hidden) #playground { bottom: calc(8px + 160px * var(--gizmo-origin, 1));
      max-height: calc(100dvh - 16px - 160px * var(--gizmo-origin, 1)); }

<body>
<label id="theme-toggle" title="Switch between light and dark mode">
  <i data-lucide="sun" aria-hidden="true"></i>
  <input id="dark-mode" type="checkbox" role="switch" aria-label="Dark mode">
  <i data-lucide="moon" aria-hidden="true"></i>
</label>
<canvas id="c3d" hidden aria-hidden="true"></canvas>
<canvas id="c"></canvas>
<aside id="playground" aria-label="Tree appearance controls">
  <header><span class="heading"><span id="count" aria-live="polite"></span></span>
    <span class="header-actions">
    <button id="reset-controls" type="button" aria-label="Reset tree controls" title="Reset controls" disabled>
    <i class="ui-icon" data-lucide="rotate-ccw" aria-hidden="true"></i>
    </button>
  </span></header>
  <div id="panel-content">
  <input id="pick" type="file" webkitdirectory hidden>
  <div class="control"><label for="pixel-control">Pixel size</label><span class="value-actions"><output id="pixel-value">3</output><button class="reset-one" type="button" data-reset="pixel-control" aria-label="Reset pixel size" title="Reset pixel size" disabled><i class="ui-icon" data-lucide="rotate-ccw" aria-hidden="true"></i></button></span><input id="pixel-control" type="range" min="2" max="6" step="1" value="3"></div>
  <div class="control"><label for="growth-control">Growth pace</label><span class="value-actions"><output id="growth-value">1.0×</output><button class="reset-one" type="button" data-reset="growth-control" aria-label="Reset growth pace" title="Reset growth pace" disabled><i class="ui-icon" data-lucide="rotate-ccw" aria-hidden="true"></i></button></span><input id="growth-control" type="range" min="0.5" max="2" step="0.1" value="1"></div>
  <div class="control"><label for="blossom-control">Blossom size</label><span class="value-actions"><output id="blossom-value">1.0×</output><button class="reset-one" type="button" data-reset="blossom-control" aria-label="Reset blossom size" title="Reset blossom size" disabled><i class="ui-icon" data-lucide="rotate-ccw" aria-hidden="true"></i></button></span><input id="blossom-control" type="range" min="0.5" max="2" step="0.1" value="1"></div>
  <div class="control"><label for="branch-control">Branch thickness</label><span class="value-actions"><output id="branch-value">1.0×</output><button class="reset-one" type="button" data-reset="branch-control" aria-label="Reset branch thickness" title="Reset branch thickness" disabled><i class="ui-icon" data-lucide="rotate-ccw" aria-hidden="true"></i></button></span><input id="branch-control" type="range" min="0.5" max="2" step="0.1" value="1"></div>
  <div class="control"><label for="moss-control">Moss coverage</label><span class="value-actions"><output id="moss-value">1.0×</output><button class="reset-one" type="button" data-reset="moss-control" aria-label="Reset moss coverage" title="Reset moss coverage" disabled><i class="ui-icon" data-lucide="rotate-ccw" aria-hidden="true"></i></button></span><input id="moss-control" type="range" min="0" max="2" step="0.1" value="1"></div>
  <div class="control toggle"><label for="auto-zoom">Auto zoom to fit tree <kbd>A</kbd></label><input id="auto-zoom" type="checkbox" aria-keyshortcuts="A"></div>

  </span></div>
</aside>
<div id="view-tools" hidden>
  <div id="rotation-gizmo" hidden tabindex="0" role="group" aria-label="3D rotation. Drag to orbit, click an axis to align. Arrow keys rotate; X, Y, Z and Home select axis views." title="Drag to rotate · click an axis to align · X / Y / Z / Home"></div>
  <p id="view-hint" role="status" hidden></p>
</div>
<div id="folder-menu" role="menu" aria-label="Folder actions" hidden>
  <button id="folder-menu-toggle" type="button" role="menuitem" tabindex="-1">Expand folder</button>
  <button id="folder-menu-copy" type="button" role="menuitem" tabindex="-1">Copy path</button>
</div>
<script type="module">
import { parse } from './parse.js';
import { viewProgress, gizmoProgress } from './tree-space.js';
import { createIcons, Eye, EyeOff, RotateCcw, Option, Command, Sun, Moon } from 'lucide';
const lucideIcons = { Eye, EyeOff, RotateCcw, Option, Command, Sun, Moon };

let PX = 3;          // screen pixels per canvas pixel
let growthPace = 1, blossomScale = 1, branchScale = 1, mossCoverage = 1;
const STEP = 4;      // world units between branch points
const SKETCH = .12;
const THICKEN = 1.8;
const TWIG_SPEED = 220;
const C = { core: '#8d8a82', core2: '#a9a69d', edge: '#1e1c1a', edge2: '#5a4c40', tip: '#c2aba0', bud: '#b4232c',
            moss: ['#9fe01b', '#cdf23f'], mossDark: '#3e8f17', mossLight: '#eef77a' };
const PETALS = ['#ffc0d3', '#ffb3c9', '#ffd6e2', '#f7a1bd'], CORES = ['#e0567f', '#f5d76e'];
const pixels = (cls, rows, fill = '') => `<svg class="${cls}" viewBox="0 0 ${rows[0].length} ${rows.length}" width="${rows[0].length}" ` +

  for (const input of inputs) resetSlider(input, input === replayInput);
});
function wake() {
  if (!root) return;
  if (timer) { clearTimeout(timer); timer = null; requestAnimationFrame(frame); }
  else if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
}

function render(b, clock, alpha, time, z, ox, oy, s) {
  if (clock <= 0) return;
  ctx.globalAlpha = alpha;
  const tick = Math.floor(time * 8), { pts, dur } = b;
  const snap = v => Math.floor(v / s) * s, X = x => (x * z + ox) / PX, Y = y => (y * z + oy) / PX;
  let cur;
  const dot = (x, y, c) => { if (c !== cur) ctx.fillStyle = cur = c; ctx.fillRect(snap(x), snap(y), s, s); };
  const ageAt = i => clock - pts[i].tr * dur;
  const widthAt = i => clamp(Math.round((1 + Math.floor((ageAt(i) - SKETCH) / THICKEN * pts[i].w)) * branchScale), 1, Math.ceil(pts[i].w * branchScale));
  const line = (x, y, a, L, seed, solid) => {
    for (let d = 0; d < L; d += s) {
      if (!solid && hash(seed + d, 0) < .4) continue;
      dot(snap(x + Math.cos(a) * d), snap(y + Math.sin(a) * d),
          hash(seed + d, 1) < .55 ? C.tip : hash(seed + d, 2) < .7 ? C.core : C.edge2);
    }
  };

  let x0 = X(pts[0].x), y0 = Y(pts[0].y), q = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], age = ageAt(i);
    if (age < 0) break;
    const x1 = X(p.x), y1 = Y(p.y), n = i ? Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / s)) : 1;
    const w = widthAt(i);
    const vert = Math.abs(Math.cos(p.a)) >= Math.abs(Math.sin(p.a));
    for (let j = 1; j <= n; j++, q++) {
      const x = snap(x0 + (x1 - x0) * j / n), y = snap(y0 + (y1 - y0) * j / n);
      if (age < SKETCH) { if (q % 3 === 0) dot(x, y, C.tip); continue; }
      for (let k = 0; k < w; k++) {
        const flick = hash(q * 7 + k, tick) < .05;
        const dither = ((q + k) & 1) ^ flick;
        const offset = (k - Math.floor(w / 2)) * s;
        dot(vert ? x : x + offset, vert ? y + offset : y,
            k === w - 1 && w > 1 ? (dither ? C.edge : C.edge2) : k === 0 && w > 2 ? (dither ? C.edge2 : C.edge)
            : dither ? C.core : flick ? C.core2 : C.edge2);
      }
    }
    if (p.bud && age > .6) dot(snap(vert ? x1 : x1 - s), snap(vert ? y1 - s : y1), C.bud);
    if (p.knot && age > .8) {
      const kx = snap(x1), ky = snap(y1) + (vert ? s : 0);
      dot(kx, ky, C.edge); dot(kx + s, ky, C.edge); dot(kx - s, ky, C.edge2); dot(kx + 2 * s, ky, C.core2);
    }
    x0 = x1; y0 = y1;
  }

  for (const tw of b.twigs) {
    const age = ageAt(tw.i) - tw.delay;
    if (age <= 0) continue;
    const grown = Math.min(tw.len, age * TWIG_SPEED);
    if (tw.path) {
      const sourceWidth = widthAt(tw.i);
      for (let j = 1; j < tw.path.length; j++) {
        const a = tw.path[j - 1], b = tw.path[j];
        if (a.d >= grown) break;
        const g = Math.min(1, (grown - a.d) / (b.d - a.d)), x = X(a.x), y = Y(a.y);
        const dx = (X(b.x) - x) * g, dy = (Y(b.y) - y) * g;
        const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / s));
        const vertical = Math.abs(dx) >= Math.abs(dy);
        for (let n = 0; n <= steps; n++) {
          const progress = (a.d + (b.d - a.d) * g * n / steps) / tw.len;
          const width = Math.max(1, Math.round(sourceWidth * Math.max(0, 1 - progress) ** .7));
          for (let cell = 0; cell < width; cell++) {
            const offset = (cell - Math.floor(width / 2)) * s;
            dot(x + dx * n / steps + (vertical ? 0 : offset), y + dy * n / steps + (vertical ? offset : 0),
              width > 1 && cell === width - 1 ? C.edge : ((j + cell) & 1) ? C.edge2 : C.core);
          }
        }
      }
      continue;
    }
    const p = pts[tw.i], x = X(p.x), y = Y(p.y), k = z / PX;
    line(x, y, tw.a, grown * k, tw.seed, tw.stalk);
    if (tw.fork && grown > tw.fork.at * tw.len) {
      const fx = x + Math.cos(tw.a) * tw.fork.at * tw.len * k, fy = y + Math.sin(tw.a) * tw.fork.at * tw.len * k;
      line(fx, fy, tw.a + tw.fork.da, Math.min(tw.fork.len * tw.len, grown - tw.fork.at * tw.len) * k, tw.seed + 99);
    }
  }

  for (const m of b.moss) {
    const age = ageAt(m.i) - m.delay;
    if (age <= 0) continue;
    const g = Math.min(1, age / m.dur), r = m.r * 3.2 * z / PX * (1 - (1 - g) ** 3) * (1 + .08 * Math.sin(time * 1.7 + m.seed) * g);
    if (r < .5) continue;
    const p = pts[m.i], cx = snap(X(p.x - Math.sin(p.a) * m.side * m.off)), cy = snap(Y(p.y + Math.cos(p.a) * m.side * m.off));
    const world = { x: p.x - Math.sin(p.a) * m.side * m.off, y: p.y + Math.cos(p.a) * m.side * m.off };
    if (placedLabels.some(b => inside(world, { ...b, x0: b.textX0 }, m.r * 3.5 * Math.max(m.ax, 1) + 10))) continue;
    const rx = r * m.ax / s, ry = r / s, Rx = Math.ceil(rx), Ry = Math.ceil(ry);
    for (let iy = -Ry; iy <= Ry; iy++) for (let ix = -Rx; ix <= Rx; ix++) {
      const d = (ix / rx) ** 2 + (iy / ry) ** 2;
      if (d > 1 - .6 * hash(ix + m.seed, iy)) continue;
      const x = cx + ix * s, y = cy + iy * s, n = hash(ix * 3 + m.seed, iy * 5);
      const checker = ((x + y) / s & 1) ^ (hash(ix + iy * 31 + m.seed, tick) < .04);
      if (d > .5 && checker) continue;
      dot(x, y, n < .02 ? C.edge : n < .14 ? C.mossDark : n > .95 ? C.mossLight : C.moss[checker]);
    }
  }

  for (const f of b.blossoms) {
    const age = ageAt(f.i) - f.delay;
    if (age <= 0 || placedLabels.some(b => inside(f, { ...b, x0: b.textX0 }, 18))) continue;
    const t = clamp(age / .65, 0, 1), g = t * t * (3 - 2 * t);
    const x = snap(X(f.x)), y = snap(Y(f.y)), radius = f.size * blossomScale * g, unit = STEP * z / PX;
    const petalCell = (dx, dy, color) => {
      const left = snap(x + dx * unit), top = snap(y + dy * unit);
      const right = Math.max(left + s, snap(x + (dx + 1) * unit)), bottom = Math.max(top + s, snap(y + (dy + 1) * unit));
      for (let py = top; py < bottom; py += s) for (let px = left; px < right; px += s) dot(px, py, color);
    };
    ctx.globalAlpha = alpha * (.4 + .6 * g);
    for (let j = 0; j < 5; j++) {
      const a = f.angle + j * Math.PI * 2 / 5;
      const px = Math.round(Math.cos(a) * radius), py = Math.round(Math.sin(a) * radius);
      petalCell(px, py, f.petal);
      if (g > .4) { petalCell(px - 1, py, f.petal); petalCell(px, py - 1, f.petal); petalCell(px - 1, py - 1, f.petal); }
      const inner = Math.max(0, radius - .8);
      petalCell(Math.round(Math.cos(a) * inner), Math.round(Math.sin(a) * inner), f.petal);
    }
    petalCell(0, 0, t < .2 ? CORES[0] : f.core);
  }
  ctx.globalAlpha = alpha;
}

function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000), instant = reduceMotion.matches, time = now / 1000;
  last = now;
  let busy = false, shown = 0;
  const closing = !!viewTransition?.leaving;
  if (view3d) {
    view3d.sync(branches);
    if (viewTransition) {
      const transition = viewTransition, t = instant ? 1 : clamp((now - transition.start) / transition.duration, 0, 1);
      const phase = viewProgress(t, closing);
      viewBlend = closing ? transition.fromBlend * phase.blend : phase.blend;
      updateGizmo(closing ? transition.fromGizmo * (1 - t) : t);
      if (closing) {
        view3d.state.yaw = transition.fromYaw + (transition.frontYaw - transition.fromYaw) * phase.front;
        view3d.state.pitch = transition.fromPitch * (1 - phase.front);
        cam = { x: transition.fromCam.x + (transition.restore.cam.x - transition.fromCam.x) * phase.front,
          y: transition.fromCam.y + (transition.restore.cam.y - transition.fromCam.y) * phase.front };
        userZoom = transition.fromZoom + (transition.restore.zoom - transition.fromZoom) * phase.front;
      }
      cv.style.opacity = String(1 - viewBlend);
      if (t === 1) {
        if (closing) finish3D(transition.restore);
        else { viewTransition = null; document.body.classList.remove('view-changing'); }
      } else busy = true;
    }
    if (view3d && !closing) busy = view3d.step(dt, instant) || busy;
  }
  let tg;
  if (!manual && !orbitDragging && !closing) {
    tg = autoZoomControl.checked ? autoTarget(6) : target();
    const k = instant || !cam ? 1 : Math.min(1, dt * 3);
    cam = cam || tg;
    cam = { x: cam.x + (tg.x - cam.x) * k, y: cam.y + (tg.y - cam.y) * k };
    if (tg.zoom !== undefined) userZoom += (tg.zoom - userZoom) * k;
    busy ||= Math.abs(tg.x - cam.x) + Math.abs(tg.y - cam.y) > .3 || (tg.zoom !== undefined && Math.abs(tg.zoom - userZoom) > .001);
  }
  if (zoomTarget !== null && (manual || tg?.zoom === undefined)) {
    userZoom += (zoomTarget - userZoom) * (instant ? 1 : Math.min(1, dt * 6));
    if (Math.abs(zoomTarget - userZoom) < .001) { userZoom = zoomTarget; zoomTarget = null; }
    else busy = true;
  } else if (zoomTarget !== null && Math.abs(tg.zoom - userZoom) < .001) {
    userZoom = tg.zoom; zoomTarget = null;
  }
  const z = zoom();
  const ox = W / 2 - cam.x * z, oy = H / 2 - cam.y * z, s = Math.max(1, Math.floor(z * STEP / PX));
  const advance = (v, on, cap) => {
    const nv = instant ? (on ? cap : 0) : on ? Math.min(cap, v + dt * growthPace) : Math.max(0, v - dt * growthPace * (v + 1) * 2);
    if (nv !== v) busy = true;
    return nv;
  };

  const drawn = [], visibleNodes = [];
  (function walk(node) {
    const b = node.branch;
    b.age = advance(b.age, open.has(node), b.cap);
    drawn.push(node);
    for (const kid of node.children) {
      const vis = b.age > b.dur * kid.tr;
      if (vis !== kid.vis) {
        kid.vis = vis;
        kid.el.classList.toggle('on', vis);
        kid.el.setAttribute('aria-hidden', !vis);
        kid.el.tabIndex = vis ? 0 : -1;
      }
      const projected = view3d ? view3d.project(kid) : kid;
      kid.el.style.transform = `translate(${projected.x * z + ox}px,${projected.y * z + oy}px) scale(${z * Q}) ${kid.place}`;
      if (vis) { shown++; visibleNodes.push(kid); }
      if (kid.children) {
        kid.back.style.transform = kid.el.style.transform;
        kid.back.hidden = !vis;
        const o = open.has(kid), flapTarget = o ? 4 : kid.hovered ? 1 : 0;
        kid.flap = instant ? flapTarget : kid.flap + (flapTarget - kid.flap) * Math.min(1, dt * 16);
        if (Math.abs(kid.flap - flapTarget) > .02) busy = true;
        else kid.flap = flapTarget;
        const flapFrame = Math.round(kid.flap);
        if (kid.flapFrame !== flapFrame) {
          kid.el.firstElementChild.innerHTML = FOLDER_FRAMES[flapFrame]; kid.flapFrame = flapFrame;
        }
        kid.back.classList.toggle('open', o);
        if (kid.isOpen !== o) { kid.isOpen = o; kid.el.classList.toggle('open', o); kid.el.setAttribute('aria-expanded', o); }
        if (kid.branch) walk(kid);
      }
    }
  })(root);

  ctx.clearRect(0, 0, cv.width, cv.height);
  if (view3d) {
    if (viewBlend < 1) {
      ctx.fillStyle = canvasBackground; ctx.fillRect(0, 0, cv.width, cv.height);
      for (const n of drawn) render(n.branch, n.branch.age, 1, time, z, ox, oy, s);
    }
    view3d.render(cam, z, W, H, PX, branchScale, blossomScale, instant ? 0 : time);
    view3d.occludeLabels(visibleNodes, z, Q, cam, W, H, PX);
  } else for (const n of drawn) render(n.branch, n.branch.age, 1, time, z, ox, oy, s);
  ctx.globalAlpha = 1;
  for (const n of drawn) if (n !== root && n.branch?.age === 0 && !open.has(n)) discard(n);

  countEl.textContent = root.children.length ? shown + (shown === 1 ? ' item' : ' items') : 'No paths found';
  if (busy) requestAnimationFrame(frame);
  else if (instant) running = false;
  else timer = setTimeout(() => { timer = null; requestAnimationFrame(frame); }, 1000 / 12);
}

function beginOrbit() {
  if (!view3d || !cam || orbitDragging) return;
  const pts = focus.branch.pts, center = pts[Math.floor(pts.length / 2)];
  const shift = view3d.setPivot(center); cam.x += shift.x; cam.y += shift.y;
  orbitDragging = true; manual = !autoZoomControl.checked; zoomTarget = null;
}

const pointers = new Map();
let dragged = false;
const gesture = () => {
  const ps = [...pointers.values()].slice(0, 2);
  return { x: ps.reduce((a, p) => a + p.x, 0) / ps.length, y: ps.reduce((a, p) => a + p.y, 0) / ps.length,
           d: ps.length > 1 ? Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y) : 0 };
};
addEventListener('pointerdown', e => {
  if (e.target.closest('#playground, #folder-menu, #view-tools, #theme-toggle')) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, type: e.pointerType, mode: null,
    capture: e.target.closest('.item') || cv });
  dragged = false;
});
addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p || !cam) return;
  const g0 = gesture();
  p.x = e.clientX; p.y = e.clientY;
  const g1 = gesture();
  if (!dragged && Math.hypot(p.x - p.sx, p.y - p.sy) < 4) return;
  if (!dragged) p.capture.setPointerCapture?.(e.pointerId);
  dragged = true; document.body.classList.add('dragging');
  const touchOrbit = view3d && pointers.size === 2 && [...pointers.values()].every(p => p.type === 'touch');
  p.mode ||= view3d && e.altKey ? 'orbit' : 'pan';
  if (view3d && (p.mode === 'orbit' || touchOrbit)) {
    e.preventDefault();
    beginOrbit();
    view3d.orbit(g1.x - g0.x, g1.y - g0.y);
    if (touchOrbit && Math.abs(g1.d - g0.d) > .5 && g0.d) zoomAt(g1.d / g0.d, g1.x, g1.y);
    wake(); return;
  }
  // cmd+drag: up zooms in, down zooms out, anchored where the drag started
  if (e.metaKey && pointers.size === 1) return zoomAt(Math.exp((g0.y - g1.y) * .01), p.sx, p.sy);
  panBy(g1.x - g0.x, g1.y - g0.y);
  if (g0.d && g1.d) zoomAt(g1.d / g0.d, g1.x, g1.y);
});
const release = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) orbitDragging = false;
  if (!pointers.size) document.body.classList.remove('dragging');
  setTimeout(() => dragged = false); // Wait for the click event that follows pointerup.
};
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

addEventListener('wheel', e => {
  if (e.target.closest('#playground, #folder-menu, #view-tools, #theme-toggle')) return;
  e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : 1; // Convert line-based wheel deltas to pixels.
  if (e.ctrlKey) zoomAt(Math.exp(-e.deltaY * k * .01), e.clientX, e.clientY);
  else panBy(-e.deltaX * k, -e.deltaY * k);
}, { passive: false });
let gs = 1; // Safari reports trackpad pinch through gesture events.
addEventListener('gesturestart', e => { e.preventDefault(); gs = 1; });
addEventListener('gesturechange', e => { e.preventDefault(); zoomAt(e.scale / gs, e.clientX, e.clientY); gs = e.scale; });

addEventListener('keydown', e => {
  if (!folderMenu.hidden) {
    const items = [...folderMenu.querySelectorAll('[role="menuitem"]')], index = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); closeFolderMenu(true); return; }
    if (e.key === 'Tab') { closeFolderMenu(false); return; }
    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
      e.preventDefault();
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (index + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[next].focus(); return;
    }
  }
  if (view3d && e.altKey && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key) &&
      !e.target.closest('input:not([type="checkbox"]), textarea, select, [contenteditable="true"]')) {
    e.preventDefault();
    view3d.orbit(e.key === 'ArrowLeft' ? -16 : e.key === 'ArrowRight' ? 16 : 0, e.key === 'ArrowUp' ? -16 : e.key === 'ArrowDown' ? 16 : 0);
    manual = !autoZoomControl.checked; wake(); return;
  }
  if (e.key === 'Escape' && focus?.parent) return toggle(focus);
  if (!e.repeat && e.key.toLowerCase() === 'a' && !e.ctrlKey && !e.metaKey && !e.altKey &&
      !e.target.closest('input, textarea, select, [contenteditable="true"]')) {
    autoZoomControl.checked = !autoZoomControl.checked;
    autoZoomControl.dispatchEvent(new Event('change'));
    return;
  }
  if (!(e.ctrlKey || e.metaKey)) return;
  const f = { '+': 1.25, '=': 1.25, '-': .8, '_': .8, '0': 0 }[e.key];
  if (f === undefined) return;
  e.preventDefault();
  if (f) {
    zoomTarget = clamp((zoomTarget ?? userZoom) * f, minUserZoom(), 6);
    manual = true; wake();
  } else { view3d?.reset(); zoomTarget = 1; manual = false; wake(); }
});

const src = new URLSearchParams(location.search).get('tree') || 'tree.txt';
const fail = () => { countEl.textContent = `Couldn't read ${src}. Open a folder or drop a list of paths.`; };
document.getElementById('pick').onchange = e => {
  const files = [...e.target.files];
  const localFiles = new Map(files.map(file => [file.webkitRelativePath.split('/').slice(1).join('/').replaceAll('\\', '/'), file]));
  const paths = files.map(file => file.webkitRelativePath.slice(file.webkitRelativePath.indexOf('/') + 1));
  if (paths.length) load(paths.join('\n'), localFiles);
};
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); e.dataTransfer.files[0]?.text().then(load, fail); });
addEventListener('resize', resize);
resize();
fetch(src).then(r => r.ok ? r.text() : Promise.reject()).then(load, fail);
</script>
</body>
</html>
